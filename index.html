<h1>Steel Salvo — free naval battle browser game</h1>
<p>Command a destroyer, cruiser, battleship or submarine against endless waves of AI warships in realistic 3D. Aim with ballistic shells that need a lead, launch torpedo spreads, dive to periscope depth and attack from below the waves, look through binoculars and use islands as cover. JavaScript and WebGL are required to play.</p>
<h2>Controls</h2>
<p>W/S engine telegraph, A/D rudder, mouse to aim, left mouse button to fire, 1 main battery, 2 torpedoes, R repair, C gun camera or periscope, F walk the deck (right button: binoculars), Z/X rise and dive (submarine), Esc pause.</p>
